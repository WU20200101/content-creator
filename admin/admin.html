<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Content-Creator Admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="wrap">
<header class="top">
  <h1>Content-Creator Admin</h1>
  <p>User → Baseline → Tuning → Prompt Preview</p>
</header>

<section class="card">
  <input id="workerUrl" placeholder="Worker URL">
  <input id="token" placeholder="ADMIN_TOKEN" type="password">
  <button id="saveConn">保存连接</button>
</section>

<div class="grid">
  <section class="panel">
    <h2>客户信息</h2>
    <textarea id="userProfile"></textarea>
  </section>

  <section class="panel">
    <h2>Baseline（规则）</h2>
    <button id="loadSchema">加载 Baseline</button>
    <div id="baselineMount"></div>

    <h2>内容调节（最高优先级）</h2>
    <textarea id="overrideText"></textarea>
  </section>
</div>

<section class="card">
  <h2>Prompt Preview</h2>
  <button id="previewPrompt">生成 Prompt</button>
  <pre id="promptPreview"></pre>
</section>

<section class="card">
  <h2>Prompt Presets</h2>
  <input id="presetName" placeholder="Preset name">
  <button id="savePreset">保存</button>
  <button id="loadPresets">刷新</button>
  <div id="presetList"></div>
</section>

<section class="card">
  <h2>生成内容</h2>
  <button id="generate">发送 Worker</button>
  <pre id="output"></pre>
</section>

</div>
<script src="admin.js"></script>
</body>
</html>
