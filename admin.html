<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Content‑Creator Admin</title>
  <link rel="stylesheet" href="./admin.css?v=5"/>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand__title">Content‑Creator Admin</div>
      <div class="brand__sub">User Profile · Baseline · Tuning · Prompt Preview</div>
    </div>

    <div class="connbar">
      <div class="connbar__field">
        <span class="connbar__label">地址</span>
        <input id="workerBaseUrl" placeholder="Worker地址"/>
      </div>
      <div class="connbar__field">
        <span class="connbar__label">密码</span>
        <input id="adminToken" type="password" placeholder="Admin Token"/>
      </div>
      <button class="btn btn--dark" id="btnSaveConn">保存</button>
    </div>
  </header>

  <main class="wrap">
    <div class="actions">
      <button class="btn btn--dark" id="btnSimpleMode">简洁模式</button>
      <button class="btn btn--dark" id="btnClearDraft">清除草稿</button>
      <button class="btn btn--dark" id="btnReloadSchemas">重新加载</button>
      <button class="btn btn--dark" id="btnPreview">脚本预览</button>
      <button class="btn btn--primary" id="btnGenerate">内容生成</button>
    </div>

    <section class="layout">
      <!-- Left: editor -->
      <section class="card card--left">
        <div class="card__head">
          <div class="card__headLeft">
            <div class="card__title">基本信息</div>
          </div>

          <div class="card__headRight">
            <button class="btn btn--primary" id="btnResetBaseline">重置基线</button>
            <div class="seg">
              <button class="seg__btn seg__btn--active" data-pane="form" data-target="left">表单</button>
              <button class="seg__btn" data-pane="json" data-target="left">代码</button>
            </div>
          </div>
        </div>

        <div class="pane pane--active" id="pane_left_form">
          <div class="leftBody">
            <div class="secList" id="secList"></div>
            <div class="secEditor" id="secEditor"></div>
          </div>
        </div>

        <div class="pane" id="pane_left_json">
          <textarea class="jsonbox" id="json_all" spellcheck="false"></textarea>
          <div class="hint small">高级模式：直接编辑整包 JSON（user_profile / baseline / tuning），Ctrl+Enter 或失焦同步。</div>
        </div>
      </section>

      <!-- Right: preview/output/presets -->
      <section class="rightcol">
        <section class="card">
          <div class="card__head">
            <div>
              <div class="card__title">脚本及内容生成</div>
            </div>
          </div>

          <div class="rightBody">
            <div class="acc" data-acc="finalPrompt">
              <div class="acc__head">
                <div class="acc__chev">▾</div>
                <div class="acc__title">最终脚本</div>
              </div>
              <div class="acc__body">
                <textarea class="previewbox" id="promptPreview" spellcheck="false"></textarea>
                <div class="hint small" id="previewMeta"></div>
              </div>
            </div>

            <div class="acc" data-acc="output">
              <div class="acc__head">
                <div class="acc__chev">▾</div>
                <div class="acc__title">内容生成</div>
              </div>
              <div class="acc__body">
                <textarea class="previewbox" id="outputBox" spellcheck="false"></textarea>
                <div class="hint small" id="jobMeta"></div>
              </div>
            </div>
          </div>
        </section>

        <section class="card">
          <div class="card__head">
            <div>
              <div class="card__title">预设脚本</div>
            </div>
            <div class="presetActions">
              <button class="btn btn--danger" id="btnPresetDelete">删除预设</button>
            </div>
          </div>

          <div class="presetBody">
            <div class="presetRow">
              <select id="presetSelect"></select>
              <button class="btn btn--primary" id="btnPresetLoad">加载预设</button>
            </div>
            <div class="presetRow">
              <input id="presetName" placeholder="预设名称"/>
              <button class="btn btn--dark" id="btnPresetSave">保存预设</button>
            </div>
          </div>
        </section>
      </section>
    </section>

    <footer class="foot">
      <div class="foot__left">Style: Apple / iOS · Minimal white · Form + JSON advanced mode</div>
      <div class="foot__right">
        <span class="statusLabel">状态提醒：</span>
        <span id="statusLine"></span>
      </div>
    </footer>
  </main>

<script src="./admin.js?v=5"></script>
</body>
</html>
